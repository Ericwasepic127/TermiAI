name: Build Linux App (Compressed)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Flet App
        uses: flet-dev/flet-build-action@v1
        with:
          target: linux
          runner-python-version: '3.14'
          bundled-python-version: '3.14'
          extra-args: '--no-compile-app --exclude dist/ --exclude .github/ --exclude .git/'

      - name: Compress build output
        run: |
          cd build/linux
          tar -cf - . | zstd -22 --ultra -o ../../termiai-linux.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: termiai-linux
          path: termiai-linux.tar.zst
          retention-days: 5
