name: Build Linux App (Compressed)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      #- name: Build Flet App
      #  uses: flet-dev/flet-build-action@v1
      #  with:
      #    target: linux
      #    runner-python-version: '3.14'
      #    bundled-python-version: '3.14'
      #    extra-args: '--module-name termiai_main --no-compile-app --exclude dist/ --exclude .github/ --exclude .git/'
      - name: Install dependences
        run: |
          pip3 install flet[all]
          sudo apt update
          sudo apt install -y $(flet --version --json | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")

      - name: Build the app
        run: flet build linux --verbose --no-compile-app --exclude dist/ --exclude .github/ --exclude .git/ --module-name termiai_main --yes
          
      - name: Compress build output
        run: |
          cd build/linux
          tar -cf - . | zstd -22 --ultra -o ../../termiai-linux.tar.zst
          tar -cf - . | xz -9 -T0 > ../../termiai-linux.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: termiai-linux-zst
          path: termiai-linux.tar.zst
          retention-days: 5

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: termiai-linux-xz
          path: termiai-linux.tar.xz
          retention-days: 5
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: termiai-linux-raw
          path: build/linux/
          retention-days: 5
