name: Build and publish Flet web app

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          mkdir -p ${{ github.workspace }}/.apt-cache/archives/partial
          sudo rm -f /etc/apt/apt.conf.d/docker-clean || true
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/01keep-debs
      - name: Cache APT packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ matrix.os }}-webtrialbuild
          restore-keys: |
            apt-${{ matrix.os }}-webtrialbuild
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p src/assets/
          cp -r assets/* src/assets/
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          fi

          python -m pip install flet[all]
          sudo apt update
          sudo apt install -y $(flet --version --json | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")

      - name: Build Flet web app
        shell: bash
        run: |
          flet build web \
            --module-name termiai_main.py \
            --no-compile-app \
            --no-compile-packages \
            --yes \
            --verbose \
            --base-url "/${GITHUB_REPOSITORY#*/}/"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web