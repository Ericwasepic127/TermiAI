name: Make windows build

on: 
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          check-latest: false
      - name: Build the app
        env:
            PYTHONUTF8: "1"
            PYTHONIOENCODING: "utf-8"
        run: |
          chcp 65001
          pip install flet[all] pyinstaller 
          flet build linux --verbose --no-compile-app --exclude dist/ --exclude .github/ --exclude .git/ --module-name termiai_main --yes --no-compile-packages
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: build\windows
      - name: Compile the installer
        run: iscc installer.iss
      - uses: actions/upload-artifact@v7
        with:
          name: termiai-windows-setup
          path: build\installer\*.exe
      - name: Attach Installer to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build\installer\*.exe
