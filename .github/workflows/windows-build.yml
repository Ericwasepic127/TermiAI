name: Make windows build

on: 
  release:
    types: [published]
  workflow_dispatch:
    includerelease:
      description: 'Upload in release?'
      type: boolean
      required: false
      default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          check-latest: false
      - name: Build the app
        env:
            PYTHONUTF8: "1"
            PYTHONIOENCODING: "utf-8"
        run: |
          chcp 65001
          pip install flet[all] pyinstaller 
          flet build windows --verbose --no-compile-app --exclude dist/ --exclude .github/ --exclude .git/ --module-name termiai_main --yes
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: build\windows
      - name: Compile the installer
        run: iscc installer.iss
      - uses: actions/upload-artifact@v7
        with:
          name: termiai-windows-setup
          path: build\installer\*.exe
      - name: Attach .deb to GitHub Release
        if: github.event_name == 'release' || inputs.includerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', steps.ver.outputs.version) }}
          files: build\installer\*.exe
