name: Build & Publish .deb + APT Repo on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
            CLEAN_VER="${RAW_TAG#v}"
          else
            CLEAN_VER="${{ github.event.inputs.version }}"
          fi
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Building version: ${CLEAN_VER}"

      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          path: main-repo

      - name: Install dependences
        run: |
          pip3 install flet[all]
          sudo apt update
          sudo apt install -y $(flet --version --json | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)['linux_dependencies']))")

      - name: Build the app
        run: cd main-repo && flet build linux --verbose --no-compile-app --exclude dist/ --exclude .github/ --exclude .git/ --module-name termiai_main --yes

      - name: Package .deb using linux-template
        id: pkg
        run: |
          cd main-repo
          VER="${{ steps.ver.outputs.version }}"
          DEB_NAME="termiai-linux-${VER}-${{ matrix.arch }}.deb"
          rm -rf linux-template/usr/lib/TermiAI/*
          mkdir -p linux-template/usr/lib/TermiAI
          cp -r build/linux/* linux-template/usr/lib/TermiAI/
          chmod -R 755 linux-template/usr/lib/TermiAI
          mkdir -p linux-template/usr/bin
          ln -sf /usr/lib/TermiAI/Terminal-Assistant-Interface linux-template/usr/bin/termiai
          sed -i "s/^Version:.*/Version: ${VER}/" linux-template/DEBIAN/control
          chmod 755 linux-template/DEBIAN/* 2>/dev/null || true
          chmod 644 linux-template/DEBIAN/control
          mkdir ../debpacks
          dpkg-deb --root-owner-group --build linux-template "../debpacks/$DEB_NAME"
          echo "deb_name=${DEB_NAME}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: debpacks-${{ matrix.arch }}
          path: debpacks/
      - name: Attach .deb to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.deb_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: debpack-arm64
          path: debpacks-arm64/
      - uses: actions/download-artifact@v6
        with:
          name: debpack-amd64
          path: debpacks-amd64/
      
      - name: Checkout existing apt-repos branch
        uses: actions/checkout@v7
        with:
          ref: apt-repos
          path: apt-repo

      - name: Do publishing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "GPG_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          cp -r debpacks-arm64/* apt-repo/
          cp -r debpacks-amd64/* apt-repo/
          cd apt-repo

          ls -t *.deb | tail -n +8 | xargs -r rm --

          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="TermiAI" \
            -o APT::FTPArchive::Release::Label="TermiAI" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Official APT repository for TermiAI" \
            release . > Release
            
          gpg --batch --yes --export "$GPG_KEY_ID" > termiai.gpg

          rm -f InRelease Release.gpg
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f *.deb Packages Packages.gz Release InRelease Release.gpg termiai.gpg
          git commit -m "Release (GPG Signed)" || echo "No changes to commit"
          git push origin apt-repos
