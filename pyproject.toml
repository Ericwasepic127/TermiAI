[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "TermiAI"
version = "0.1.0"
authors = [
  { name="Ericwasepic127", email="ericwasepic127@outlook.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "requests",
    "platformdirs",
    "httpx",
    "flet",
]

[project.urls]
Homepage = "https://github.com/ericwasepic127/termiai"
Issues = "https://github.com/ericwasepic127/termiai/issues"
