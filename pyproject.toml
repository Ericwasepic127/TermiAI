[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "TermiAI"
version = "1.0.6"
authors = [
  { name="Ericwasepic127", email="ericwasepic127@outlook.com" },
]
description = "Your personal AI assistant to help terminal"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "requests",
    "platformdirs",
    "httpx",
    "flet[all]",
]

[project.scripts]
termiai = "termiai:ftmain"
termiai-factory-reset = "termiai.clean:main"

[tool.flet]
org = "io.github.ericwasepic127"
product = "TermiAI"
build_number = 1

[tool.flet.app]
path = "src"
module = "termiai_main"

[project.urls]
Homepage = "https://github.com/ericwasepic127/termiai"
Issues = "https://github.com/ericwasepic127/termiai/issues"
